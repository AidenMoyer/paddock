set default=0
set timeout=10
insmod all_video
# also show the menu on a serial console when the machine has one (headless servers, CI)
if serial --unit=0 --speed=115200; then
  terminal_input --append serial
  terminal_output --append serial
fi

menuentry "Install Paddock OS @VERSION@@EDITION@" {
  linux /live/vmlinuz boot=live paddock.installer quiet
  initrd /live/initrd.img
}
menuentry "Try Paddock OS without installing (nothing is saved)" {
  linux /live/vmlinuz boot=live paddock.live quiet
  initrd /live/initrd.img
}
menuentry "Install Paddock OS (safe graphics)" {
  linux /live/vmlinuz boot=live paddock.installer nomodeset
  initrd /live/initrd.img
}
