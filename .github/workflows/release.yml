name: Release

# Push a tag like v0.1.0 to build and publish everything:
#   container images (ghcr.io) · Paddock OS ISO (standard + NVIDIA) · Android APK · TrueNAS app YAML
# "Run workflow" by hand builds and tests the same things without publishing (artifacts only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      iso:
        description: Build and boot-test the ISOs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          app="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server/paddock/__init__.py)"
          if [ "$PUBLISH" = true ]; then
            v="${GITHUB_REF_NAME#v}"
            [ "$v" = "$app" ] || { echo "::error::tag $GITHUB_REF_NAME doesn't match server/paddock/__init__.py ($app)"; exit 1; }
          else
            v="$app-dev.${GITHUB_RUN_NUMBER}"
          fi
          IFS=. read -r ma mi pa <<<"${app}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((ma * 1000000 + mi * 1000 + ${pa%%[!0-9]*}))" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: pip install -r server/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: server

  ffmpeg:
    name: Paddock FFmpeg
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with:
          path: ffmpeg/out
          key: paddock-ffmpeg-amd64-${{ hashFiles('ffmpeg/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: OUT="$PWD/ffmpeg/out" bash ffmpeg/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: paddock-ffmpeg
          path: ffmpeg/out/
          retention-days: 7

  images:
    name: Container images
    needs: [version, tests, ffmpeg]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: paddock-ffmpeg
          path: ffmpeg/out
      - name: build (and push on release tags)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          app="ghcr.io/$owner/paddock"; wg="ghcr.io/$owner/paddock-wg"
          docker build -f deploy/Dockerfile -t "$app:$VERSION" -t "$app:latest" .
          docker build -t "$wg:$VERSION" -t "$wg:latest" deploy/wireguard
          docker run --rm --entrypoint /opt/paddock-ffmpeg/bin/ffmpeg "$app:$VERSION" -hide_banner -filters | grep -qw whisper
          if [ "$PUBLISH" = true ]; then
            echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            for t in "$app:$VERSION" "$app:latest" "$wg:$VERSION" "$wg:latest"; do docker push "$t"; done
          fi

  iso:
    name: Paddock OS (${{ matrix.variant }})
    needs: [version, ffmpeg]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.iso
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, nvidia]
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: paddock-ffmpeg
          path: ffmpeg/out
      - name: build tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends mmdebstrap debian-archive-keyring squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools zstd ca-certificates curl \
            qemu-system-x86 qemu-utils ovmf procps
      - name: build the ISO
        run: bash os/build.sh --variant "${{ matrix.variant }}" --version "${{ needs.version.outputs.version }}" --ffmpeg ffmpeg/out/paddock-ffmpeg-*-amd64.tar.zst
      - name: boot-test in a VM
        run: bash os/test/smoke.sh os/out/*.iso "${{ matrix.variant == 'standard' && 'full' || 'live' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: iso-${{ matrix.variant }}
          path: os/out/
          compression-level: 0
          retention-days: 7

  apk:
    name: Android app
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: build the release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PADDOCK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export PADDOCK_KEYSTORE="$RUNNER_TEMP/release.jks"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; releases must be signed"; exit 1
          fi
          cd android
          ./gradlew --no-daemon assembleRelease -PversionName="${{ needs.version.outputs.version }}" -PversionCode="${{ needs.version.outputs.code }}"
          out="$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned || ls app/build/outputs/apk/release/*.apk)"
          mkdir -p ../dist && cp "$out" "../dist/paddock-${{ needs.version.outputs.version }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/

  publish:
    name: GitHub release
    needs: [version, images, iso, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: assemble the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir dist
          cp artifacts/iso-standard/*.iso artifacts/iso-nvidia/*.iso artifacts/apk/*.apk dist/
          sed -e "s|ghcr.io/aidenmoyer/paddock:latest|ghcr.io/$owner/paddock:$VERSION|" \
              -e "s|ghcr.io/aidenmoyer/paddock-wg:latest|ghcr.io/$owner/paddock-wg:$VERSION|" \
              deploy/compose.yaml > "dist/paddock-truenas-$VERSION.yaml"
          sed -e "s|ghcr.io/aidenmoyer/paddock:latest|ghcr.io/$owner/paddock:$VERSION|" \
              -e "s|ghcr.io/aidenmoyer/paddock-wg:latest|ghcr.io/$owner/paddock-wg:$VERSION|" \
              deploy/compose.node.yaml > "dist/paddock-node-$VERSION.yaml"
          (cd dist && sha256sum * > SHA256SUMS)
          cat > notes.md <<EOF
          ## Downloads

          | File | What it is |
          |---|---|
          | \`paddock-os-$VERSION-amd64.iso\` | **Paddock OS**: a minimal Linux that runs Paddock and nothing else. Intel and AMD GPU transcoding. Write it to a USB stick (balenaEtcher, Rufus in DD mode, or \`dd\`), boot, choose *Install*. |
          | \`paddock-os-nvidia-$VERSION-amd64.iso\` | The same, plus the NVIDIA driver (GTX 900-series and newer) for NVENC/NVDEC transcoding. |
          | \`paddock-truenas-$VERSION.yaml\` | TrueNAS SCALE: *Apps → Discover Apps → ⋮ → Install via YAML*, paste, edit the marked lines. |
          | \`paddock-$VERSION.apk\` | Android app (Android 8+). |
          | \`paddock-node-$VERSION.yaml\` | Paddock Node, the backup/partner server (any Docker host). |

          Container images: \`ghcr.io/$owner/paddock:$VERSION\` and \`ghcr.io/$owner/paddock-wg:$VERSION\`.

          Verify downloads with \`SHA256SUMS\`. Paddock OS needs Secure Boot turned off for now.
          See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for setup.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Paddock $VERSION" --notes-file notes.md --verify-tag
