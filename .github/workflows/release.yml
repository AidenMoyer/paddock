name: Release

# Push a tag like v0.1.0 to build and publish everything:
#   container images (ghcr.io) · Paddock OS ISO (standard + NVIDIA) · Android APK · TrueNAS app YAML
# "Run workflow" by hand builds and tests the same things without publishing (artifacts only).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      iso:
        description: Build and boot-test the ISOs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          app="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server/paddock/__init__.py)"
          if [ "$PUBLISH" = true ]; then
            v="${GITHUB_REF_NAME#v}"
            [ "$v" = "$app" ] || { echo "::error::tag $GITHUB_REF_NAME doesn't match server/paddock/__init__.py ($app)"; exit 1; }
          else
            v="$app-dev.${GITHUB_RUN_NUMBER}"
          fi
          IFS=. read -r ma mi pa <<<"${app}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((ma * 1000000 + mi * 1000 + ${pa%%[!0-9]*}))" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: pip install -r server/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: server

  ffmpeg:
    name: Paddock FFmpeg
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      # build.sh installs zstd, so the cache is saved with it. It has to be here for the lookup too, or the lookup never
      # finds that copy, and every release has to build FFmpeg again and needs ffmpeg.org to be up.
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends zstd
      - id: cache
        uses: actions/cache@v6
        with:
          path: ffmpeg/out
          key: paddock-ffmpeg-amd64-${{ hashFiles('ffmpeg/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: OUT="$PWD/ffmpeg/out" bash ffmpeg/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: paddock-ffmpeg
          path: ffmpeg/out/
          retention-days: 7

  images:
    name: Container images
    needs: [version, tests, ffmpeg, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: paddock-ffmpeg
          path: ffmpeg/out
      - uses: actions/download-artifact@v8
        with:
          name: android-app
          path: server/android-app
      - name: build (and push on release tags)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          app="ghcr.io/$owner/paddock"; wg="ghcr.io/$owner/paddock-wg"
          docker build -f deploy/Dockerfile -t "$app:$VERSION" -t "$app:latest" .
          docker build -t "$wg:$VERSION" -t "$wg:latest" deploy/wireguard
          docker run --rm --entrypoint /opt/paddock-ffmpeg/bin/ffmpeg "$app:$VERSION" -hide_banner -filters > filters.txt
          grep -qw whisper filters.txt
          if [ "$PUBLISH" = true ]; then
            echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            for t in "$app:$VERSION" "$app:latest" "$wg:$VERSION" "$wg:latest"; do docker push "$t"; done
          fi

  iso:
    name: Paddock OS (${{ matrix.variant }})
    needs: [version, ffmpeg, apk]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.iso
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, nvidia]
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: paddock-ffmpeg
          path: ffmpeg/out
      - uses: actions/download-artifact@v8
        with:
          name: android-app
          path: server/android-app
      - name: build tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends mmdebstrap debian-archive-keyring squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools zstd ca-certificates curl \
            qemu-system-x86 qemu-utils ovmf procps
      - name: build the ISO
        run: bash os/build.sh --variant "${{ matrix.variant }}" --version "${{ needs.version.outputs.version }}" --ffmpeg ffmpeg/out/paddock-ffmpeg-*-amd64.tar.zst
      - name: boot-test in a VM
        run: bash os/test/smoke.sh os/out/*.iso "${{ matrix.variant == 'standard' && 'full' || 'live' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: iso-${{ matrix.variant }}
          path: os/out/
          compression-level: 0
          retention-days: 7

  apk:
    name: Android app
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: build the release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PADDOCK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            export PADDOCK_KEYSTORE="$RUNNER_TEMP/release.jks"
            export PADDOCK_KEYSTORE_PASSWORD="$(printf '%s' "$PADDOCK_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; releases must be signed"; exit 1
          fi
          cd android
          ./gradlew --no-daemon assembleRelease -PversionName="${{ needs.version.outputs.version }}" -PversionCode="${{ needs.version.outputs.code }}"
          out="$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned || ls app/build/outputs/apk/release/*.apk)"
          mkdir -p ../dist ../bundle && cp "$out" "../dist/paddock-${{ needs.version.outputs.version }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          # the copy each server release carries for in-app updates
          cp "$out" ../bundle/paddock.apk
          printf '{"version_name": "%s", "version_code": %s, "sha256": "%s", "size": %s}\n' \
            "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.code }}" \
            "$(sha256sum "$out" | cut -d' ' -f1)" "$(stat -c%s "$out")" > ../bundle/release.json
          cat ../bundle/release.json
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: bundle/

  desktop:
    name: Desktop app (${{ matrix.label }})
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            task: packageMsi
          - label: Linux
            os: ubuntu-24.04
            task: packageDeb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: bundle libVLC (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # the official VideoLAN build, pinned by its published SHA-256; only what playback needs
          curl -fsSL -o vlc.zip https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.zip
          echo "a0b7ec02b50adf6417eed014fb8df50af39690505a4225b85b3dc2ed17d14843  vlc.zip" | sha256sum -c -
          unzip -q vlc.zip
          dst=android/desktop/resources/windows/vlc
          mkdir -p "$dst/plugins"
          cp vlc-3.0.21/libvlc.dll vlc-3.0.21/libvlccore.dll vlc-3.0.21/COPYING.txt "$dst/"
          for d in access audio_filter audio_mixer audio_output codec d3d9 d3d11 demux misc packetizer spu stream_filter \
                   text_renderer video_chroma video_filter video_output; do
            cp -r "vlc-3.0.21/plugins/$d" "$dst/plugins/"
          done
          du -sh "$dst"
      - name: build the installer
        shell: bash
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :desktop:${{ matrix.task }} -PversionName="${{ needs.version.outputs.version }}"
      - name: depend on the system's VLC (Linux)
        if: runner.os == 'Linux'
        run: |
          deb="$(ls android/desktop/build/compose/binaries/main/deb/*.deb)"
          mkdir pkg && dpkg-deb -R "$deb" pkg
          if grep -q '^Depends:' pkg/DEBIAN/control; then
            sed -i 's/^Depends: \(.*\)$/Depends: \1, libvlc5, vlc-plugin-base/' pkg/DEBIAN/control
          else
            echo 'Depends: libvlc5, vlc-plugin-base' >> pkg/DEBIAN/control
          fi
          dpkg-deb -b --root-owner-group pkg "$deb"
          dpkg-deb -I "$deb" | grep -E 'Package|Version|Depends'
      - name: collect
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          for f in android/desktop/build/compose/binaries/main/*/*; do
            case "$f" in
              *.msi) cp "$f" "dist/paddock-$v-windows-x64.msi" ;;
              *.deb) cp "$f" "dist/paddock-$v-linux-amd64.deb" ;;
            esac
          done
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: dist/

  publish:
    name: GitHub release
    needs: [version, images, iso, apk, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: assemble the release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir dist
          cp artifacts/iso-standard/*.iso artifacts/iso-nvidia/*.iso artifacts/iso-standard/*.squashfs artifacts/iso-nvidia/*.squashfs artifacts/apk/*.apk \
            artifacts/desktop-Windows/*.msi artifacts/desktop-Linux/*.deb dist/
          sed -e "s|ghcr.io/aidenmoyer/paddock:latest|ghcr.io/$owner/paddock:$VERSION|" \
              -e "s|ghcr.io/aidenmoyer/paddock-wg:latest|ghcr.io/$owner/paddock-wg:$VERSION|" \
              deploy/compose.yaml > "dist/paddock-truenas-$VERSION.yaml"
          sed -e "s|ghcr.io/aidenmoyer/paddock:latest|ghcr.io/$owner/paddock:$VERSION|" \
              -e "s|ghcr.io/aidenmoyer/paddock-wg:latest|ghcr.io/$owner/paddock-wg:$VERSION|" \
              deploy/compose.node.yaml > "dist/paddock-node-$VERSION.yaml"
          (cd dist && sha256sum * > SHA256SUMS)
          cat > notes.md <<EOF
          ## Downloads

          | File | What it is |
          |---|---|
          | \`paddock-os-$VERSION-amd64.iso\` | **Paddock OS**: a minimal Linux that runs Paddock and nothing else. Intel and AMD GPU transcoding. Write it to a USB stick (balenaEtcher, Rufus in DD mode, or \`dd\`), boot, choose *Install*. |
          | \`paddock-os-nvidia-$VERSION-amd64.iso\` | The same, plus the NVIDIA driver (GTX 900-series and newer) for NVENC/NVDEC transcoding. |
          | \`paddock-truenas-$VERSION.yaml\` | TrueNAS SCALE: *Apps → Discover Apps → ⋮ → Install via YAML*, paste, edit the marked lines. |
          | \`paddock-$VERSION.apk\` | Android app (Android 8+). Phones also update themselves from your server. |
          | \`paddock-$VERSION-windows-x64.msi\` | Windows app (10 and 11). Video playback is built in. |
          | \`paddock-$VERSION-linux-amd64.deb\` | Linux app (Debian, Ubuntu and similar). Installs VLC for video playback. |
          | \`paddock-node-$VERSION.yaml\` | Paddock Node, the backup/partner server (any Docker host). |

          Container images: \`ghcr.io/$owner/paddock:$VERSION\` and \`ghcr.io/$owner/paddock-wg:$VERSION\`.

          Verify downloads with \`SHA256SUMS\`. Paddock OS needs Secure Boot turned off for now.
          See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for setup.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Paddock $VERSION" --notes-file notes.md --verify-tag
